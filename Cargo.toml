[package]
name         = "mind"
version      = "0.8.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/mind"
description  = "Typed mind state for Persona agents."
publish      = false
build        = "build.rs"

[lib]
name = "mind"
path = "src/lib.rs"

[[bin]]
name = "mind"
path = "src/main.rs"
required-features = ["nota-text"]

[[bin]]
name = "mind-daemon"
path = "src/daemon_main.rs"

[[bin]]
name = "meta-mind"
path = "src/bin/meta-mind.rs"
required-features = ["nota-text"]

[[bin]]
name = "mind-write-configuration"
path = "src/bin/mind_write_configuration.rs"
required-features = ["nota-text"]

[[bin]]
name = "mind-live-knowledge-judge-eval"
path = "src/bin/mind-live-knowledge-judge-eval.rs"
required-features = ["live-eval"]

[features]
default                        = ["nota-text"]
eval-fixture-prepopulation     = []
live-eval                      = []
nota-text                      = ["meta-signal-mind/nota-text"]

[dependencies]
kameo               = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main", default-features = false, features = ["macros", "tracing"] }
nota           = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", branch = "main" }
meta-signal-mind    = { git = "https://github.com/LiGoldragon/meta-signal-mind.git", branch = "main", default-features = false }
meta-signal-orchestrate = { git = "https://github.com/LiGoldragon/meta-signal-orchestrate.git", branch = "main" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
redb                = "4.1"
getrandom           = "0.3"
serde_json          = "1"
sha2                = "0.10"
sema-engine         = { git = "https://github.com/LiGoldragon/sema-engine.git", branch = "main" }
signal-frame        = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-domain       = { git = "https://github.com/LiGoldragon/signal-domain.git", rev = "801e1c5bcc824c9760e246205826e3c8e962d005", features = ["nota-text"] }
signal-mind-judge   = { git = "https://github.com/LiGoldragon/signal-mind-judge.git", rev = "9f9ae47e96454677c6158c3a227b0c9493b29d51" }
signal-persona      = { git = "https://github.com/LiGoldragon/signal-persona.git", rev = "e6fbc977cdf6a19b9ee31b41d235e1808091dc88" }
signal-mind         = { git = "https://github.com/LiGoldragon/signal-mind.git", rev = "1378d5f3c317efc0c5dd4832a3346e96549cb1c7" }
triad-runtime       = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }
thiserror           = "2"
tokio               = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }

[build-dependencies]
schema-rust = { package = "schema-rust", git = "https://github.com/LiGoldragon/schema-rust.git", branch = "main" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

[patch.crates-io]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main" }

[patch."https://github.com/LiGoldragon/nota-next.git"]
nota = { git = "https://github.com/LiGoldragon/nota.git", branch = "main" }


[patch."https://github.com/LiGoldragon/schema-next.git"]
schema = { package = "schema", git = "https://github.com/LiGoldragon/schema.git", rev = "4a8aaf1de3aaf476577d5b4e93691ef47c135d1a" }
schema-cc = { package = "schema-cc", git = "https://github.com/LiGoldragon/schema.git", rev = "4a8aaf1de3aaf476577d5b4e93691ef47c135d1a" }
